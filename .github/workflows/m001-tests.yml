name: M001 Python validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q video tests
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
